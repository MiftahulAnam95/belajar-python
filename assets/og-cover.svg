<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Python dari Nol - Belajar Python untuk Pemula">
  <rect width="1200" height="630" fill="#f6f8f6" />
  <rect x="0" y="0" width="1200" height="10" fill="#157a42" />

  <g transform="translate(80 120)">
    <rect width="56" height="56" rx="12" fill="#157a42" />
    <text x="28" y="38" font-family="Inter, sans-serif" font-size="30" text-anchor="middle" fill="#ffffff">Py</text>
    <text x="80" y="37" font-family="Inter, sans-serif" font-size="30" font-weight="700" fill="#1c231f">Python dari Nol</text>
  </g>

  <text x="80" y="300" font-family="Inter, sans-serif" font-size="76" font-weight="700" fill="#1c231f">Belajar Python</text>
  <text x="80" y="386" font-family="Inter, sans-serif" font-size="76" font-weight="700" fill="#157a42">dari Nol.</text>

  <text x="80" y="452" font-family="Inter, sans-serif" font-size="30" fill="#5c6a62">Belajar programming tanpa harus pusing</text>
  <text x="80" y="494" font-family="Inter, sans-serif" font-size="30" fill="#5c6a62">dengan istilah rumit.</text>

  <g transform="translate(700 150)">
    <rect width="420" height="330" rx="16" fill="#ffffff" stroke="#e2e7e3" stroke-width="2" />
    <rect x="0" y="0" width="420" height="44" rx="16" fill="#eef2ee" />
    <circle cx="28" cy="22" r="7" fill="#ec6a5e" />
    <circle cx="52" cy="22" r="7" fill="#f4bf50" />
    <circle cx="76" cy="22" r="7" fill="#61c554" />
    <text x="108" y="28" font-family="JetBrains Mono, monospace" font-size="18" fill="#5c6a62">halo.py</text>
    <text x="28" y="98" font-family="JetBrains Mono, monospace" font-size="21" fill="#1c231f">nama = <tspan fill="#157a42">"Anam"</tspan></text>
    <text x="28" y="140" font-family="JetBrains Mono, monospace" font-size="21" fill="#1c231f">umur = <tspan fill="#b3541e">17</tspan></text>
    <text x="28" y="182" font-family="JetBrains Mono, monospace" font-size="21" fill="#a626a4">print</text>
    <text x="94" y="182" font-family="JetBrains Mono, monospace" font-size="21" fill="#1c231f">(nama)</text>
    <text x="28" y="238" font-family="JetBrains Mono, monospace" font-size="18" fill="#8a9490"># hasilnya: Anam</text>
    <text x="28" y="288" font-family="JetBrains Mono, monospace" font-size="21" fill="#1d5fa8">for</text>
    <text x="72" y="288" font-family="JetBrains Mono, monospace" font-size="21" fill="#1c231f">i <tspan fill="#a626a4">in</tspan> <tspan fill="#3b6fd4">range</tspan>(3):</text>
    <text x="56" y="320" font-family="JetBrains Mono, monospace" font-size="21" fill="#a626a4">print</text>
    <text x="122" y="320" font-family="JetBrains Mono, monospace" font-size="21" fill="#1c231f">(i)</text>
  </g>
</svg>
